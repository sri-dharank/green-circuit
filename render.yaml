services:
  - type: web
    name: greencircuit-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: greencircuit-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: greencircuit-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: greencircuit-db
          property: password

databases:
  - name: greencircuit-db
    databaseName: ewaste_db
    user: ewaste_user
    plan: free
    region: singapore
